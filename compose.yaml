name: solo51-glazebench
services:
  bench:
    build:
      context: .
      args:
        GLAZEBENCH_DEPS_IMAGE: ${GLAZEBENCH_DEPS_IMAGE:-python:3.11-slim}
    image: ${GLAZEBENCH_IMAGE:-solo51-glazebench:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      WAITRESS_THREADS: 4
    ports:
      - "127.0.0.1:${GLAZEBENCH_PORT:-19951}:8000"
    volumes:
      - glaze-library:/var/lib/glazebench
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200"]
      interval: 4s
      timeout: 4s
      retries: 12
volumes:
  glaze-library:
